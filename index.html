body{font-family:'Nunito',sans-serif;background:#F5F5F5;min-height:100vh;}

.app{max-width:600px;margin:0 auto;padding-bottom:70px;}

/* NAV */
.topnav{background:#000000;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}

.topnav-btn{background:rgba(255,255,255,0.1);border:none;border-radius:6px;padding:4px 9px;cursor:pointer;color:#ccc;font-size:11px;}
.topnav-btn:active{opacity:0.7;}

/* BOTTOM NAV */

.botnav button{flex:1;padding:8px 0;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.botnav button.active{color:#111;font-weight:700;}
.botnav button:not(.active){color:#888;font-weight:400;}
.botnav button .icon{font-size:22px;display:flex;align-items:center;justify-content:center;}
.botnav button .label{font-size:10px;}

/* VIEWS */
.view{padding:14px 16px;position:relative;}

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA /* CARDS */
.card{background:#fff;border:1px solid #E8E8E8;border-radius:12px;padding:14px;margin-bottom:10px;position:relative;z-index:1;}
.card-clickable{cursor:pointer;transition:transform 0.1s,box-shadow 0.1s;}
.card-clickable:active{transform:scale(0.98);}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;position:relative;z-index:1;}
.stat-card{border-radius:10px;padding:12px 14px;}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px;}
.stat-val{font-size:22px;font-weight:700;}
.stat-card.small .stat-val{font-size:15px;}

/* STATUS BADGES */
.badge{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;display:inline-block;}
.badge-teklif{background:#FEF3C7;color:#92400E;}
.badge-onaylandi{background:#D1FAE5;color:#065F46;}
.badge-iptal{background:#FEE2E2;color:#991B1B;}

/* PROJ CARD */
.proj-name{font-weight:700;font-size:14px;color:#111;margin-bottom:2px;font-family:'Nunito',sans-serif;}
.proj-sub{font-size:12px;color:#888;}
.proj-meta{display:flex;gap:12px;font-size:12px;color:#888;margin-top:6px;flex-wrap:wrap;}
.proj-meta strong{color:#333;}

/* FORM */
.form-label{display:block;font-size:11px;font-weight:700;color:#888;margin-bottom:3px;margin-top:12px;text-transform:uppercase;letter-spacing:0.5px;}
.form-input{width:100%;padding:10px 12px;border:1px solid #DCDCDC;border-radius:8px;font-size:14px;background:#fff;color:#111;outline:none;transition:border 0.15s;}
.form-input:focus{border-color:#111;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* BUTTONS */
.btn-primary{background:#111;color:#fff;width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:700;border:none;cursor:pointer;margin-bottom:8px;letter-spacing:0.3px;}
.btn-primary:active{background:#333;}
.btn-secondary{background:transparent;color:#666;border:1px solid #DCDCDC;width:100%;padding:12px;border-radius:10px;font-size:14px;cursor:pointer;margin-bottom:16px;}
.btn-small{background:#111;color:#fff;padding:5px 12px;border-radius:6px;font-size:12px;border:none;cursor:pointer;font-weight:600;}
.btn-small:active{background:#333;}
.btn-danger{background:transparent;color:#888;border:1px solid #DCDCDC;padding:8px 20px;border-radius:8px;font-size:13px;cursor:pointer;}
.btn-danger:active{color:#333;border-color:#999;}

/* SEARCH */
.search-bar{width:100%;padding:10px 14px;border:1px solid #DCDCDC;border-radius:10px;margin-bottom:8px;font-size:14px;background:#fff;color:#111;outline:none;}
.search-bar:focus{border-color:#111;}
.filter-row{display:flex;gap:8px;margin-bottom:10px;}
.filter-select{flex:1;padding:8px 10px;border:1px solid #DCDCDC;border-radius:8px;font-size:13px;background:#fff;color:#111;outline:none;}
.result-count{font-size:12px;color:#999;margin-bottom:8px;}

/* DETAIL */
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #F5F5F5;font-size:13px;}
.info-label{color:#999;}
.info-val{font-weight:500;color:#111;text-align:right;max-width:60%;}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.section-title{font-weight:700;font-size:13px;color:#111;font-family:'Nunito',sans-serif;}
.odeme-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F9F9F9;}
.odeme-amount{font-weight:700;font-size:14px;color:#111;}
.odeme-meta{font-size:11px;color:#999;margin-top:1px;}
.alt-row{padding:10px 0;border-bottom:1px solid #F5F5F5;}
.alt-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.alt-info{display:flex;gap:12px;font-size:12px;color:#888;flex-wrap:wrap;}
.alt-odeme-item{font-size:11px;color:#999;margin-left:8px;margin-top:3px;}
.badge-tip{background:#F0F0F0;color:#444;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600;}

/* KAZANÇ */
.kazanc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.kazanc-card{border-radius:10px;padding:10px 12px;}
.kazanc-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px;}
.kazanc-val{font-size:15px;font-weight:700;}
.kazanc-sub{font-size:10px;margin-top:2px;}

/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:999;display:flex;align-items:flex-end;justify-content:center;}
.modal-box{background:#fff;border-radius:16px 16px 0 0;padding:20px 16px 36px;width:100%;max-width:500px;}
.modal-title{font-weight:700;font-size:15px;margin-bottom:14px;color:#111;}

// --- Yedek klasoru (bilgisayarda secilen bir klasore dogrudan yazar; Chrome/Edge) ---
let backupDirHandle = null;

function idbGet(key) {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open('mt_fsdb', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => {
        const tx = req.result.transaction('handles', 'readonly');
        const g = tx.objectStore('handles').get(key);
        g.onsuccess = () => resolve(g.result || null);
        g.onerror = () => resolve(null);
      };
      req.onerror = () => resolve(null);
    } catch(e) { resolve(null); }
  });
}
function idbSet(key, val) {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open('mt_fsdb', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => {
        const tx = req.result.transaction('handles', 'readwrite');
        tx.objectStore('handles').put(val, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      };
      req.onerror = () => resolve(false);
    } catch(e) { resolve(false); }
  });
}

async function writeBackupToFolder(jsonStr, filename) {
  try {
    if (!backupDirHandle) backupDirHandle = await idbGet('backupDir');
    if (!backupDirHandle) return false;
    const opts = { mode: 'readwrite' };
    let perm = await backupDirHandle.queryPermission(opts);
    if (perm !== 'granted') {
      // Otomatik (kullanıcı etkileşimi olmayan) çalıştığında tarayıcı izni yeniden isteme reddedebilir;
      // bu durumda sessizce false dönüp indirme yöntemine düşüyoruz.
      try { perm = await backupDirHandle.requestPermission(opts); } catch(e) {}
    }
    if (perm !== 'granted') return false;
    const fileHandle = await backupDirHandle.getFileHandle(filename, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(jsonStr);
    await writable.close();
    return true;
  } catch(e) { console.error('writeBackupToFolder error:', e); return false; }
}

async function maybeAutoBackup() {
  // Gunde bir kere, veriler yuklendiginde otomatik olarak PC'de secilmis klasore yedek yazar.
  // Bu ozellik SADECE klasor secme destegi olan cihazlarda (Chrome/Edge, PC) calisir;
  // iPhone/Safari gibi desteklemeyen cihazlarda hicbir indirme/soru cikmadan sessizce atlanir.
  try {
    if (!window.showDirectoryPicker) return; // telefon/Safari: hicbir sey yapma
    if (!state.projects || state.projects.length === 0) return;
    const key = 'mt_last_autobackup';
    const today = todayStr();
    if (localStorage.getItem(key) === today) return;
    const jsonStr = JSON.stringify(state.projects, null, 2);
    const filename = `mekanik_yedek_${today}.json`;
    const wroteToFolder = await writeBackupToFolder(jsonStr, filename);
    if (wroteToFolder) {
      localStorage.setItem(key, today);
      state.lastBackupOk = 'folder';
    }
    // Klasor henuz secilmemisse (wroteToFolder=false) sessizce hicbir sey yapma ve indirme;
    // localStorage'i da guncellemiyoruz ki klasor secildiginde o gun icinde tekrar denesin.
  } catch(e) { console.error('autoBackup error:', e); }
}

let unsubProjects = null;
function subscribeProjects(uid) {
  if(unsubProjects) unsubProjects();
  unsubProjects = db.collection('users').doc(uid).collection('projects').onSnapshot(snap => {
    state.projects = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
    maybeAutoBackup();
  }, err => {
    console.error('subscribeProjects error:', err);
    state.syncErr = 'Veriler yüklenemedi: ' + (err && err.message ? err.message : err);
    render();
  });
}
async function saveProject(p) { await db.collection('users').doc(state.user.uid).collection('projects').doc(p.id).set(p); }
async function delProject(id) { await db.collection('users').doc(state.user.uid).collection('projects').doc(id).delete(); }


async function loadDinamikListe(uid) {
  try {
    const snap = await db.collection('users').doc(uid).collection('dinamikListe').get();
    snap.docs.forEach(d => {
      if(state.dinamikListe[d.id]) state.dinamikListe[d.id] = d.data().items || [];
    });
  } catch(e) { console.error('loadDinamikListe error:', e); }
  render();
}
async function saveDinamikListe(key, items) {
  await db.collection('users').doc(state.user.uid).collection('dinamikListe').doc(key).set({items});
  state.dinamikListe[key] = items;
}

auth.onAuthStateChanged( user => {
  state.user=user; state.authLoading=false; state.syncErr=null;
  try {
    if(user) {
      subscribeProjects(user.uid);
      loadDinamikListe(user.uid);
      idbGet('backupDir').then(h => { if(h){ backupDirHandle=h; state.backupDirName=h.name; render(); } });
    }
    else { if(unsubProjects) unsubProjects(); state.projects=[]; }
  } catch(e) {
    console.error('onAuthStateChanged handler error:', e);
    state.syncErr = 'Bir hata oluştu: ' + (e && e.message ? e.message : e);
  }
  render();
});

function getStats() {
  const ps=state.projects;
  return {
    total:ps.length,
    onaylandi:ps.filter(p=>p.durum==='onaylandi').length,
    teklif:ps.filter(p=>p.durum==='teklif').length,
    alindi:sumArr(ps.map(p=>sumArr((p.musteriOdemeleri||[]).map(o=>+o.miktar)))),
    odendi:sumArr(ps.map(p=>sumArr((p.altYukleniciler||[]).flatMap(a=>(a.odemeler||[]).map(o=>+o.miktar))))),
  };
}

function getFiltered() {
  const {yil,durum,q}=state.filter;
  return state.projects.filter(p=>{
    if(yil&&+p.yil!==+yil)return false;
    if(durum&&p.durum!==durum)return false;
    if(q){const ql=q.toLowerCase();if(!((p.isinAdi||'').toLowerCase().includes(ql)||(p.isinSahibi||'').toLowerCase().includes(ql)||(p.belediye||'').toLowerCase().includes(ql)))return false;}
    if(state.filter.alan&&state.filter.alan.trim()){if(!String(p.alan||'').startsWith(state.filter.alan.trim()))return false;}
    return true;
  }).sort((a,b)=>{
    // Always sort newest first: year desc, month desc, no desc
    if(+b.yil !== +a.yil) return +b.yil - +a.yil;
    const ayFark = MONTHS.indexOf(b.ay) - MONTHS.indexOf(a.ay);
    if(ayFark !== 0) return ayFark;
    return (+b.no||0) - (+a.no||0);
  });
}

function emptyForm() {
  const mx=state.projects.length>0?Math.max(...state.projects.map(p=>+p.no||0)):0;
  return {id:uid(),no:mx+1,
        yil:new Date().getFullYear(),
        ay:MONTHS[new Date().getMonth()],
        gun:new Date().getDate(),
        tarih:new Date().toISOString().slice(0,10),isinAdi:'',isinSahibi:'',belediye:'',yapiSinifi:'4A',isitma:'VAR',isiitmaTuru:'Yerden',alan:'',teklifFiyati:'',durum:'teklif',altYukleniciler:[],musteriOdemeleri:[],extraGiderler:[],hesapDurumu:'acik',not:'',createdAt:todayStr()};
}

function renderList(){
  const filtered=getFiltered();
  return `<div class="view">
    <input class="search-bar" placeholder="İş adı, mimar veya belediye..." value="${state.filter.q}" oninput="setFilter('q',this.value)">
    <div class="filter-row">
      <select class="filter-select" onchange="setFilter('yil',this.value)">
        <option value="">Tüm Yıllar</option>
        ${YEARS.map(y=>`<option value="${y}" ${state.filter.yil==y?'selected':''}>${y}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="setFilter('durum',this.value)">
        <option value="">Tüm Durumlar</option>
        <option value="teklif" ${state.filter.durum==='teklif'?'selected':''}>Teklif</option>
        <option value="onaylandi" ${state.filter.durum==='onaylandi'?'selected':''}>Onaylandı</option>
        <option value="iptal" ${state.filter.durum==='iptal'?'selected':''}>İptal</option>
      </select>
    </div>
    <input class="search-bar" type="number" placeholder="Alan filtrele (m²)... örn: 500" value="${state.filter.alan||''}" oninput="setFilter('alan',this.value)" style="margin-bottom:8px;">
    <div class="result-count">${filtered.length} proje</div>
    ${filtered.length===0?'<div class="empty">Proje bulunamadı</div>':filtered.map(renderProjCard).join('')}
  </div>`;
}

function renderProjCard(p){
  const badges={teklif:'badge-teklif',onaylandi:'badge-onaylandi',iptal:'badge-iptal'};
  const labels={teklif:'Teklif',onaylandi:'Onaylandı',iptal:'İptal'};
  return `<div class="card" style="position:relative;padding:12px 40px 12px 14px;">
    <div class="card-clickable" onclick="navTo('detail','${p.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
        <div style="font-weight:800;font-size:14px;color:#111;font-family:'Nunito',sans-serif;flex:1;margin-right:8px;">${p.isinAdi||'—'}</div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">
          <span class="badge ${badges[p.durum]||'badge-teklif'}">${labels[p.durum]||'Teklif'}</span>
          <span style="background:${(p.hesapDurumu||'acik')==='kapandi'?'#D1FAE5':'#FEE2E2'};color:${(p.hesapDurumu||'acik')==='kapandi'?'#065F46':'#991B1B'};border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap;">${(p.hesapDurumu||'acik')==='kapandi'?'✓ Kapandı':'✗ Açık'}</span>
        </div>
      </div>
      <div style="font-size:12px;color:#888;font-family:'Nunito',sans-serif;margin-bottom:6px;">${p.isinSahibi||''}${p.belediye?' · '+p.belediye:''}</div>
      <div style="display:flex;gap:14px;font-size:12px;color:#888;font-family:'Nunito',sans-serif;">
        ${p.alan?`<span>📐 ${p.alan} m²</span>`:''}
        ${p.teklifFiyati?`<span style="font-weight:700;color:#111;">💰 ${tl(p.teklifFiyati)}</span>`:''}
      </div>
    </div>
    <button onclick="silOnay('${p.id}')" style="position:absolute;top:10px;right:10px;background:none;border:none;cursor:pointer;color:#DDD;font-size:18px;padding:4px;line-height:1;">🗑</button>
  </div>`;
}

function renderDetail(){
  const p=state.projects.find(x=>x.id===state.selId);
  if(!p) return '<div class="view"><div class="empty">Proje bulunamadı</div></div>';
  const gizle = state.detailMode !== 'odeme'; // teklif modunda mali bilgileri gizle
  const alindi=sumArr((p.musteriOdemeleri||[]).map(o=>+o.miktar));
  const kalanM=(+p.teklifFiyati||0)-alindi;
  const altD=(p.altYukleniciler||[]).map(a=>({...a,topA:Math.max(0,(+a.anlasilanFiyat||0)+(+a.tusFiyat||0)-(a.isKarsiligi?(+a.isKarsiligiFiyat||0):0)),topO:sumArr((a.odemeler||[]).map(o=>+o.miktar))}));
  const topAO=sumArr(altD.map(a=>a.topO));
  const topAA=sumArr(altD.map(a=>a.topA));
  const topExtra=sumArr((p.extraGiderler||[]).map(g=>+g.miktar||0));
  const kazanc=alindi-topAO-topExtra;
  const beklK=(+p.teklifFiyati||0)-topAA;
  const badges={teklif:'badge-teklif',onaylandi:'badge-onaylandi',iptal:'badge-iptal'};
  const labels={teklif:'Teklif',onaylandi:'Onaylandı',iptal:'İptal'};

  // Info rows - mali bilgileri gizle modunda fiyat yok
  const infoRows = [
    ['Mimar / Firma', p.isinSahibi],
    ['Belediye', p.belediye],
    ['Yapı Sınıfı', p.yapiSinifi],
    ['Isıtma Türü', p.isitma==='VAR'?p.isiitmaTuru:(p.isitma==='YOK'?'Yok':null)],
    ['Alan', p.alan?p.alan+' m²':null],
    ['Teklif (KDV hariç)', p.teklifFiyati?tl(p.teklifFiyati):null],
    ['Not', p.not],
  ].filter(r=>r[1]);

  // Alt yüklenici satırı
  const altSatirlar = altD.map(a=>{
    let s = '<div class="alt-row">';
    s += '<div class="alt-header">';
    s += '<div style="display:flex;align-items:center;gap:6px"><span class="badge-tip">'+( a.tip||'')+'</span><strong style="font-size:13px;color:#111">'+( a.firma||'—')+'</strong></div>';
    if(!gizle) s += '<button class="btn-small" onclick="openModal(\'altOdeme\',\''+a.id+'\')" >+ Ödeme</button>';
    s += '</div>';
    if(!gizle){
      s += '<div class="alt-info">';
      s += '<span>Anlaşılan: <strong style="color:#333">'+tl(a.topA)+'</strong></span>';
      s += '<span>Ödendi: <strong style="color:#333">'+tl(a.topO)+'</strong></span>';
      if(a.topA-a.topO>0) s += '<span style="color:#666">Borç: <strong>'+tl(a.topA-a.topO)+'</strong></span>';
      s += '</div>';
      (a.odemeler||[]).forEach(o=>{
        s += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11px;color:#6B7280;">';
        s += '<span>→ '+o.tarih+': '+tl(o.miktar)+(o.aciklama?' ('+o.aciklama+')':'')+'</span>';
        s += '<button onclick="editAltOdeme(\''+a.id+'\',\''+o.id+'\')" style="background:none;border:1px solid #E0E0E0;border-radius:6px;cursor:pointer;color:#888;font-size:10px;padding:2px 7px;font-family:\'Nunito\',sans-serif;">Düzenle</button>';
        s += '</div>';
      });
    }
    s += '</div>';
    return s;
  }).join('');

  let musteriSection = '';
  if(!gizle){
    musteriSection = '<div class="card" style="padding:0;overflow:hidden;">'
      +'<div onclick="toggleAccordion(\'musteri_'+p.id+'\')" style="display:flex;justify-content:space-between;align-items:center;padding:14px;cursor:pointer;">'
      +'<div style="display:flex;align-items:center;gap:8px;"><div class="section-title">Müşteri Ödemeleri</div></div>'
      +'<span style="font-size:20px;color:#BBB;transform:'+(state.accordion['musteri_'+p.id]?'rotate(180deg)':'rotate(0deg)')+';display:inline-block;">⌄</span>'
      +'</div>';
    if(state.accordion['musteri_'+p.id]){
      musteriSection += '<div style="padding:0 14px 14px;border-top:1px solid #F5F5F5;">';
      if(!(p.musteriOdemeleri||[]).length) musteriSection += '<div class="empty">Henüz ödeme alınmadı</div>';
      (p.musteriOdemeleri||[]).forEach(o=>{
        musteriSection += '<div class="odeme-row"><div><div class="odeme-amount">'+tl(o.miktar)+'</div><div class="odeme-meta">'+o.tarih+' · '+(o.sekil||'')+(o.aciklama?' · '+o.aciklama:'')+'</div></div>';
        musteriSection += '<div style="display:flex;gap:4px;align-items:center;">';
        musteriSection += '<button onclick="editMusteriOdeme(\''+o.id+'\')" style="background:none;border:1px solid #E0E0E0;border-radius:6px;cursor:pointer;color:#888;font-size:11px;padding:3px 8px;font-family:\'Nunito\',sans-serif;">Düzenle</button>';
        musteriSection += '<button onclick="delMusteriOdeme(\''+o.id+'\')" style="background:none;border:none;cursor:pointer;color:#CCC;font-size:20px;padding:2px 6px">×</button></div></div>';
      });
      if(alindi>0) musteriSection += '<div style="padding-top:8px;font-weight:700;color:#111;font-size:13px">Toplam: '+tl(alindi)+'</div>';
      musteriSection += '<button class="btn-small" onclick="openModal(\'musteriOdeme\')" style="margin-top:10px;width:100%;padding:10px;">+ Ödeme Ekle</button>';
      musteriSection += '</div>';
    }
    musteriSection += '</div>';
  }

  let kazancSection = '';
  if(!gizle){
    kazancSection = '<div class="kazanc-grid">'
      +'<div class="kazanc-card" style="background:#F5F5F5"><div class="kazanc-label" style="color:#888">ALINDI</div><div class="kazanc-val" style="color:#111">'+tl(alindi)+'</div>'+(kalanM>0?'<div class="kazanc-sub" style="color:#999">Kalan: '+tl(kalanM)+'</div>':'')+'</div>'
      +'<div class="kazanc-card" style="background:#F5F5F5"><div class="kazanc-label" style="color:#888">ÖDENDİ</div><div class="kazanc-val" style="color:#555">'+tl(topAO)+'</div>'+(topAA-topAO>0?'<div class="kazanc-sub" style="color:#999">Borç: '+tl(topAA-topAO)+'</div>':'')+'</div>'
      +'<div class="kazanc-card" style="background:'+(kazanc>=0?'#111':'#E8E8E8')+'"><div class="kazanc-label" style="color:'+(kazanc>=0?'#888':'#999')+'">KAZANÇ</div><div class="kazanc-val" style="color:'+(kazanc>=0?'#fff':'#555')+'">'+tl(kazanc)+'</div>'+(topExtra>0?'<div class="kazanc-sub" style="color:'+(kazanc>=0?'#888':'#999')+'">Extra: -'+tl(topExtra)+'</div>':beklK>0?'<div class="kazanc-sub" style="color:'+(kazanc>=0?'#888':'#999')+'">Beklenen: '+tl(beklK)+'</div>':'')+'</div>'
      +'</div>';
  }

  let extraSection = '';
  if(!gizle){
    extraSection = '<div class="card" style="padding:0;overflow:hidden;">'
      +'<div onclick="toggleAccordion(\'extra_'+p.id+'\')" style="display:flex;justify-content:space-between;align-items:center;padding:14px;cursor:pointer;">'
      +'<div style="display:flex;align-items:center;gap:8px;"><div class="section-title">Extra Giderler</div></div>'
      +'<span style="font-size:20px;color:#BBB;transform:'+(state.accordion['extra_'+p.id]?'rotate(180deg)':'rotate(0deg)')+';display:inline-block;">⌄</span>'
      +'</div>';
    if(state.accordion['extra_'+p.id]){
      extraSection += '<div style="padding:0 14px 14px;border-top:1px solid #F5F5F5;">';
      if(!(p.extraGiderler||[]).length) extraSection += '<div class="empty">Henüz extra gider yok</div>';
      (p.extraGiderler||[]).forEach(g=>{
        extraSection += '<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #F9F9F9;">';
        extraSection += '<div style="flex:1;"><div style="font-size:13px;font-weight:600;color:#111;">'+( g.aciklama||'—')+'</div></div>';
        extraSection += '<div style="font-size:13px;font-weight:700;color:#EF4444;">-'+tl(g.miktar)+'</div>';
        extraSection += '<button onclick="editExtraGider(\''+g.id+'\')" style="background:none;border:1px solid #E0E0E0;border-radius:6px;cursor:pointer;color:#888;font-size:11px;padding:3px 8px;font-family:\'Nunito\',sans-serif;">Düzenle</button>';
        extraSection += '<button onclick="delExtraGider(\''+g.id+'\')" style="background:none;border:none;cursor:pointer;color:#CCC;font-size:18px;padding:2px 4px;">×</button>';
        extraSection += '</div>';
      });
      if(topExtra>0) extraSection += '<div style="padding-top:8px;font-size:13px;font-weight:700;color:#EF4444;">Toplam: -'+tl(topExtra)+'</div>';
      extraSection += '<button onclick="openModal(\'extraGider\')" style="width:100%;padding:10px;background:#111;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:\'Nunito\',sans-serif;cursor:pointer;margin-top:10px;">+ Gider Ekle</button>';
      extraSection += '</div>';
    }
    extraSection += '</div>';
  }

  return `<div class="view">
    <div class="back-header">
      <button class="back-btn" onclick="goBack()">←</button>
      <div class="back-title">${p.isinAdi||'—'}</div>
      <button class="edit-btn" onclick="navTo('form','${p.id}')">Düzenle</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <span class="badge ${badges[p.durum]||'badge-teklif'}" style="cursor:pointer;padding:5px 14px;font-size:12px" onclick="durumSecildi('${p.id}',document.querySelector('[data-durum]')?.value)">${labels[p.durum]||'Teklif'}</span>
      <span style="font-size:12px;color:#999">${p.gun?p.gun+' ':''}${p.ay||''} ${p.yil||''}</span>
    </div>
    <div class="card" style="background:#FAFAFA;border:none">
      ${infoRows.map(([k,v])=>`<div class="info-row"><span class="info-label">${k}</span><span class="info-val">${v}</span></div>`).join('')}
    </div>
    ${musteriSection}
    <div class="card" style="padding:0;overflow:hidden;">
      <div onclick="toggleAccordion('alt_${p.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:14px;cursor:pointer;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="section-title">Alt Yükleniciler</div>
          ${altD.length>0?`<span style="background:#F0F0F0;color:#555;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;">${altD.length} adet</span>`:''}
        </div>
        <span style="font-size:20px;color:#BBB;transform:${state.accordion['alt_'+p.id]?'rotate(180deg)':'rotate(0deg)'};display:inline-block;">⌄</span>
      </div>
      ${state.accordion['alt_'+p.id]?`<div style="padding:0 14px 14px;border-top:1px solid #F5F5F5;">
        ${altD.length===0?'<div class="empty">Bu projede alt yüklenici yok</div>':''}
        ${altSatirlar}
      </div>`:''}
    </div>
    ${extraSection}
    ${kazancSection}
    ${gizle?`<div style="padding:16px 0 8px;">
      <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;font-family:'Nunito',sans-serif;">Teklif Durumu</div>
      <div style="background:${p.durum==='onaylandi'?'#D1FAE5':p.durum==='iptal'?'#FEE2E2':'#F5F5F5'};border-radius:12px;padding:4px;">
        <select onchange="durumSecildi('${p.id}',this.value)" data-durum style="width:100%;padding:12px 14px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;background:transparent;color:${p.durum==='onaylandi'?'#065F46':p.durum==='iptal'?'#991B1B':'#555'};outline:none;appearance:auto;">
          <option value="teklif" ${p.durum==='teklif'?'selected':''}>⏳ Beklemede</option>
          <option value="onaylandi" ${p.durum==='onaylandi'?'selected':''}>✓ Onaylandı</option>
          <option value="iptal" ${p.durum==='iptal'?'selected':''}>✗ İptal</option>
        </select>
      </div>
    </div>`:''}
    ${!gizle?`<div style="padding:0 0 16px;">
      <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;font-family:'Nunito',sans-serif;">Hesap Durumu</div>
      <div style="background:${(p.hesapDurumu||'acik')==='kapandi'?'#D1FAE5':'#FEE2E2'};border-radius:12px;padding:4px;">
        <select onchange="hesapDurumuGuncelle('${p.id}',this.value)" style="width:100%;padding:12px 14px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;background:transparent;color:${(p.hesapDurumu||'acik')==='kapandi'?'#065F46':'#991B1B'};outline:none;appearance:auto;">
          <option value="acik" ${(p.hesapDurumu||'acik')==='acik'?'selected':''}>✗ Açık</option>
          <option value="kapandi" ${p.hesapDurumu==='kapandi'?'selected':''}>✓ Kapandı</option>
        </select>
      </div>
    </div>`:''}
  </div>`;
}

function renderForm(){
  const f=state.form; if(!f) return '';
  const isEdit=state.projects.some(p=>p.id===f.id);
  const isSahipleri=[...new Set([...FIRMALAR,...(state.dinamikListe.isSahipleri||[])])].sort();
  return `<div class="view">
    <div class="back-header">
      <button class="back-btn" onclick="goBack()">←</button>
      <div class="back-title">${isEdit?'Proje #'+f.no+' Düzenle':'Yeni Proje Ekle'}</div>
    </div>
    <div style="margin-bottom:14px;">
      <label class="form-label">Tarih</label>
      <input type="date" class="form-input" 
        value="${f.tarih||new Date().toISOString().slice(0,10)}"
        onchange="setTarih(this.value)"
        style="font-size:14px;">
    </div>
    <label class="form-label">İşin Adı *</label>
    <input class="form-input" placeholder="Örn: BM Vizyon Yıldırım Konut" value="${f.isinAdi||''}" oninput="setForm('isinAdi',this.value)">
    <label class="form-label">Mimar / Firma</label>
    <button onclick="openListeModal('isSahibi')" style="width:100%;padding:10px 12px;border:1px solid #DCDCDC;border-radius:8px;font-size:14px;font-family:'Nunito',sans-serif;background:#fff;color:${f.isinSahibi?'#111':'#9CA3AF'};text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <span>${f.isinSahibi||'Seçin veya ekleyin...'}</span>
      <span style="color:#9CA3AF;font-size:18px;">›</span>
    </button>
    <div class="form-row">
      <div><label class="form-label">Belediye</label><select class="form-input" onchange="setForm('belediye',this.value)"><option value="">Seçin</option>${["Osmangazi","Nilüfer","Yıldırım","Gemlik","Mudanya","Kestel","Karacabey","İnegöl","Gürsu","Orhangazi","İznik","Yalova","İstanbul","Keles","Nilüfer OSB","Demirtaş OSB"].map(b=>`<option ${f.belediye===b?'selected':''}>${b}</option>`).join('')}</select></div>
      <div><label class="form-label">Yapı Sınıfı</label><select class="form-input" onchange="setForm('yapiSinifi',this.value)">${['1','2','3A','3B','4A','4B','4C','5A','5B','5C','5D'].map(s=>`<option ${f.yapiSinifi===s?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="form-row">
      <div><label class="form-label">Isıtma</label><select class="form-input" onchange="setFormAndRender('isitma',this.value)"><option ${f.isitma==='VAR'?'selected':''} value="VAR">Var</option><option ${f.isitma==='YOK'?'selected':''} value="YOK">Yok</option></select></div>
      <div><label class="form-label">Isıtma Türü</label><select class="form-input" ${f.isitma==='YOK'?'disabled style="opacity:0.4"':''} onchange="setForm('isiitmaTuru',this.value)">${['Yerden','Radyatörlü','Klima','VRF','Karma'].map(t=>`<option ${f.isiitmaTuru===t?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="form-row">
      <div><label class="form-label">Alan (m²)</label><input class="form-input" type="number" placeholder="0" value="${f.alan||''}" oninput="setForm('alan',this.value)"></div>
    </div>
    <label class="form-label">Durum</label>
    <select class="form-input" onchange="setForm('durum',this.value)">
      <option value="teklif" ${f.durum==='teklif'?'selected':''}>Teklif Verildi</option>
      <option value="onaylandi" ${f.durum==='onaylandi'?'selected':''}>Onaylandı / İş Alındı</option>
      <option value="iptal" ${f.durum==='iptal'?'selected':''}>İptal</option>
    </select>
    <div style="background:#F9F9F9;border:1px solid #ECECEC;border-radius:12px;padding:14px;margin-top:12px;margin-bottom:4px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div class="section-title">Alt Yükleniciler</div>
        <button class="btn-small" onclick="addAlt()">+ Ekle</button>
      </div>
      ${(f.altYukleniciler||[]).length===0?'<div class="empty">Elektrik, akustik vb. varsa ekleyin</div>':''}
      ${(f.altYukleniciler||[]).map(a=>{
        const tipFirmalar = [...(TIP_FIRMALAR[a.tip]||[]),...(state.dinamikListe.altFirmalar||[])];
        return `<div class="alt-item-form">
        <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;">
          <div style="flex:1;">
            <select class="form-input" style="margin-bottom:0;" onchange="updAltTip('${a.id}',this.value)">
              ${[...TIPLER,...(state.dinamikListe.altTipler||[])].map(t=>`<option ${a.tip===t?'selected':''}>${t}</option>`).join('')}
            </select>
            ${a.tip==='Diğer'?`<div style="display:flex;gap:6px;margin-top:6px;">
              <input id="yeniTip_${a.id}" placeholder="Tip adını girin (ör: Yangın Tesisatı)..." class="form-input" style="margin-bottom:0;flex:1;font-size:13px;" value="${a.tipAdi||''}">
              <button onclick="altTipKaydet('${a.id}')" class="btn-small" style="flex-shrink:0;padding:10px 14px;">✓</button>
            </div>`:''}
          </div>
          <button onclick="delAlt('${a.id}')" style="background:none;border:none;cursor:pointer;color:#CCC;font-size:24px;padding:4px;flex-shrink:0;line-height:1;">×</button>
        </div>
        ${tipFirmalar.length>0?`<button onclick="openAltFirmaModal('${a.id}')" style="width:100%;padding:10px 12px;border:1px solid #DCDCDC;border-radius:8px;font-size:13px;font-family:'Nunito',sans-serif;background:#fff;color:${a.firma?'#111':'#9CA3AF'};text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span>${a.firma||'Firma seç...'}</span>
          <span style="color:#9CA3AF;font-size:16px;">›</span>
        </button>`:''}
        <!-- Anlaşılan Fiyat -->
        <input class="form-input" type="text" inputmode="numeric" placeholder="Anlaşılan fiyat (₺ KDV hariç)" value="${a.anlasilanFiyat?new Intl.NumberFormat('tr-TR').format(+a.anlasilanFiyat):''}" oninput="updAlt('${a.id}','anlasilanFiyat',formatFiyatInput(this));updateAltTotaal('${a.id}')">
        
        <!-- İş Karşılığı -->
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <input type="checkbox" id="ik_${a.id}" ${a.isKarsiligi?'checked':''} onchange="updAlt('${a.id}','isKarsiligi',this.checked)" style="width:18px;height:18px;cursor:pointer;accent-color:#111;">
          <label for="ik_${a.id}" style="font-size:13px;color:#555;font-family:'Nunito',sans-serif;cursor:pointer;">İş Karşılığı</label>
          ${a.isKarsiligi?`<input class="form-input" type="text" inputmode="numeric" style="margin-bottom:0;flex:1;" placeholder="İş karşılığı fiyatı..." value="${a.isKarsiligiFiyat?new Intl.NumberFormat('tr-TR').format(+a.isKarsiligiFiyat):''}" oninput="updAlt('${a.id}','isKarsiligiFiyat',formatFiyatInput(this));updateAltTotaal('${a.id}')">`:''}
        </div>

        <!-- TUS -->
        <div style="background:#F9F9F9;border-radius:10px;padding:10px;margin-bottom:8px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${a.tus?'8px':'0'};">
            <span style="font-size:13px;font-weight:700;color:#555;font-family:'Nunito',sans-serif;">TUS</span>
            <div style="display:flex;gap:6px;">
              <button onclick="updAlt('${a.id}','tus',false)" style="padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;border:2px solid ${!a.tus?'#111':'#E0E0E0'};background:${!a.tus?'#111':'#fff'};color:${!a.tus?'#fff':'#999'};">Yok</button>
              <button onclick="updAlt('${a.id}','tus',true)" style="padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;border:2px solid ${a.tus?'#111':'#E0E0E0'};background:${a.tus?'#111':'#fff'};color:${a.tus?'#fff':'#999'};">Var</button>
            </div>
          </div>
          ${a.tus?`<input class="form-input" type="text" inputmode="numeric" style="margin-bottom:0;" placeholder="TUS anlaşılan fiyatı (₺ KDV hariç)" value="${a.tusFiyat?new Intl.NumberFormat('tr-TR').format(+a.tusFiyat):''}" oninput="updAlt('${a.id}','tusFiyat',formatFiyatInput(this));updateAltTotaal('${a.id}')">`:''}
        </div>

        <!-- Toplam -->
        <div id="alt_total_${a.id}" style="display:flex;flex-direction:column;gap:3px;padding:8px 0;border-top:1px solid #E8E8E8;margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:12px;font-weight:700;color:#555;font-family:'Nunito',sans-serif;">Net Ödeme</span>
            <span id="alt_net_${a.id}" style="font-size:15px;font-weight:800;color:#111;font-family:'Nunito',sans-serif;">${tl((+a.anlasilanFiyat||0)+(+a.tusFiyat||0)-(a.isKarsiligi?(+a.isKarsiligiFiyat||0):0))}</span>
          </div>
        </div>

        <!-- Not -->
        <input class="form-input" placeholder="Not (opsiyonel)..." value="${a.altNot||''}" oninput="updAlt('${a.id}','altNot',this.value)" style="font-size:12px;color:#666;">
      </div>`;}).join('')}
    </div>
    <!-- TUS (Toplam Teklif) -->
    <div style="background:#F9F9F9;border-radius:10px;padding:10px;margin-top:12px;margin-bottom:4px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${f.tus?'8px':'0'};">
        <span style="font-size:13px;font-weight:700;color:#555;font-family:'Nunito',sans-serif;">TUS</span>
        <div style="display:flex;gap:6px;">
          <button onclick="setFormAndRender('tus',false)" style="padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;border:2px solid ${!f.tus?'#111':'#E0E0E0'};background:${!f.tus?'#111':'#fff'};color:${!f.tus?'#fff':'#999'};">Yok</button>
          <button onclick="setFormAndRender('tus',true)" style="padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;border:2px solid ${f.tus?'#111':'#E0E0E0'};background:${f.tus?'#111':'#fff'};color:${f.tus?'#fff':'#999'};">Var</button>
        </div>
      </div>
      ${f.tus?`<input class="form-input" type="text" inputmode="numeric" style="margin-bottom:0;" placeholder="TUS anlaşılan fiyatı (₺ KDV hariç)" value="${f.tusFiyat?new Intl.NumberFormat('tr-TR').format(+f.tusFiyat):''}" oninput="setForm('tusFiyat',formatFiyatInput(this))">`:''}
    </div>
    <label class="form-label">Toplam Teklif (₺ KDV hariç)</label>
    <input class="form-input" type="text" inputmode="numeric" placeholder="0" value="${f.teklifFiyati?new Intl.NumberFormat('tr-TR').format(+f.teklifFiyati):''}" oninput="setForm('teklifFiyati',formatFiyatInput(this))">
    <label class="form-label">Not</label>
    <textarea class="form-input" placeholder="Özel notlar..." style="min-height:70px;resize:vertical" oninput="setForm('not',this.value)">${f.not||''}</textarea>
    <button class="btn-primary" onclick="doSaveForm()">Kaydet</button>
    <button class="btn-secondary" onclick="goBack()">İptal</button>
  </div>`;
}



function renderTeklifOzet(){
  const p = state.projects.find(x=>x.id===state.selId) || state.lastSavedProj;
  if(!p) return renderList();
  const altD = (p.altYukleniciler||[]).filter(a=>a.tip||a.anlasilanFiyat);
  const topAlt = altD.reduce((s,a)=>s+(+a.anlasilanFiyat||0),0);
  const badges={teklif:'badge-teklif',onaylandi:'badge-onaylandi',iptal:'badge-iptal'};
  const labels={teklif:'Teklif Verildi',onaylandi:'Onaylandı',iptal:'İptal'};
  return `<div style="background:#fff;min-height:calc(100vh - 122px);padding:20px 16px;">
    <!-- Başlık -->
    <div style="text-align:center;margin-bottom:24px;">

function renderRapor(){
  const rf = state.raporFilter || {yil:'', firma:'', durum:''};
  const firmalar = [...new Set([...FIRMALAR,...(state.dinamikListe.isSahipleri||[])])].sort();
  
  // Filter projects
  let ps = state.projects.filter(p => {
    if(rf.yil && +p.yil !== +rf.yil) return false;
    if(rf.firma && p.isinSahibi !== rf.firma) return false;
    if(rf.durum && p.durum !== rf.durum) return false;
    return true;
  });

  const toplamTeklif = ps.length;
  const onaylandi = ps.filter(p=>p.durum==='onaylandi').length;
  const bekleyen = ps.filter(p=>p.durum==='teklif').length;
  const iptal = ps.filter(p=>p.durum==='iptal').length;
  
  // Yıllara göre
  const yillar = [...new Set(state.projects.map(p=>p.yil))].sort((a,b)=>b-a);
  const raporYillar = [...new Set(ps.map(p=>p.yil))].sort((a,b)=>b-a);

  return `<div style="background:#fff;min-height:calc(100vh - 122px);padding:16px;">
    
    <!-- Filtreler -->
    <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-family:'Nunito',sans-serif;">Filtrele</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
      <select onchange="setRaporFilter('yil',this.value)" style="width:100%;padding:10px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;font-family:'Nunito',sans-serif;background:#fff;color:#111;outline:none;">
        <option value="">Tüm Yıllar</option>
        ${yillar.map(y=>`<option value="${y}" ${rf.yil==y?'selected':''}>${y}</option>`).join('')}
      </select>
      <select onchange="setRaporFilter('firma',this.value)" style="width:100%;padding:10px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;font-family:'Nunito',sans-serif;background:#fff;color:#111;outline:none;">
        <option value="">Tüm Mimarlar / Firmalar</option>
        ${firmalar.map(f=>`<option value="${f}" ${rf.firma===f?'selected':''}>${f}</option>`).join('')}
      </select>
      <select onchange="setRaporFilter('durum',this.value)" style="width:100%;padding:10px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;font-family:'Nunito',sans-serif;background:#fff;color:#111;outline:none;">
        <option value="">Tüm Durumlar</option>
        <option value="teklif" ${rf.durum==='teklif'?'selected':''}>Beklemede</option>
        <option value="onaylandi" ${rf.durum==='onaylandi'?'selected':''}>Onaylandı</option>
        <option value="iptal" ${rf.durum==='iptal'?'selected':''}>İptal</option>
      </select>
    </div>

    <!-- Özet Kartları -->
    <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-family:'Nunito',sans-serif;">Genel Özet ${rf.yil||rf.firma||rf.durum?'(Filtrelenmiş)':''}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
      <div style="background:#111;border-radius:12px;padding:14px;">
        <div style="font-size:10px;color:#888;font-weight:700;text-transform:uppercase;margin-bottom:4px;font-family:'Nunito',sans-serif;">Toplam</div>
        <div style="font-size:32px;font-weight:800;color:#fff;font-family:'Nunito',sans-serif;">${toplamTeklif}</div>
      </div>
      <div style="background:#D1FAE5;border-radius:12px;padding:14px;">
        <div style="font-size:10px;color:#065F46;font-weight:700;text-transform:uppercase;margin-bottom:4px;font-family:'Nunito',sans-serif;">Onaylanan</div>
        <div style="font-size:32px;font-weight:800;color:#065F46;font-family:'Nunito',sans-serif;">${onaylandi}</div>
      </div>
      <div style="background:#FEF3C7;border-radius:12px;padding:14px;">
        <div style="font-size:10px;color:#92400E;font-weight:700;text-transform:uppercase;margin-bottom:4px;font-family:'Nunito',sans-serif;">Bekleyen</div>
        <div style="font-size:32px;font-weight:800;color:#92400E;font-family:'Nunito',sans-serif;">${bekleyen}</div>
      </div>
      <div style="background:#FEE2E2;border-radius:12px;padding:14px;">
        <div style="font-size:10px;color:#991B1B;font-weight:700;text-transform:uppercase;margin-bottom:4px;font-family:'Nunito',sans-serif;">İptal</div>
        <div style="font-size:32px;font-weight:800;color:#991B1B;font-family:'Nunito',sans-serif;">${iptal}</div>
      </div>
    </div>

    <!-- Yıllara Göre (sadece filtre yoksa veya yıl filtresi yoksa) -->
    ${!rf.yil && raporYillar.length > 0 ? `
    <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-family:'Nunito',sans-serif;">Yıllara Göre</div>
    <div style="background:#F9F9F9;border-radius:14px;padding:4px 14px;margin-bottom:16px;">
      ${raporYillar.map(y=>{
        const yps = ps.filter(p=>p.yil==y);
        const yOnay = yps.filter(p=>p.durum==='onaylandi').length;
        const yBekle = yps.filter(p=>p.durum==='teklif').length;
        const yIptal = yps.filter(p=>p.durum==='iptal').length;
        return `<div style="padding:12px 0;border-bottom:1px solid #EBEBEB;font-family:'Nunito',sans-serif;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <span style="font-size:16px;font-weight:800;color:#111;">${y}</span>
            <span style="font-size:13px;font-weight:700;color:#555;">${yps.length} teklif</span>
          </div>
          <div style="display:flex;gap:8px;font-size:12px;">
            <span style="background:#D1FAE5;color:#065F46;padding:2px 8px;border-radius:20px;font-weight:700;">${yOnay} onaylı</span>
            <span style="background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:20px;font-weight:700;">${yBekle} bekleyen</span>
            ${yIptal>0?`<span style="background:#FEE2E2;color:#991B1B;padding:2px 8px;border-radius:20px;font-weight:700;">${yIptal} iptal</span>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>` : ''}

    <!-- Dışa Aktar -->
    <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-family:'Nunito',sans-serif;">Dışa Aktar</div>
    <div style="display:flex;gap:10px;padding-bottom:20px;">
      <button onclick="raporCiktıSor('pdf')" style="flex:1;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;">
        📄 PDF
      </button>
      <button onclick="raporCiktıSor('excel')" style="flex:1;padding:14px;background:#fff;color:#111;border:2px solid #111;border-radius:12px;font-size:14px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;">
        📊 Excel
      </button>
    </div>
  </div>`;
}

function renderOdemeRapor(){
  const ps = state.projects.filter(p=>
    (p.musteriOdemeleri||[]).length>0 || 
    (p.altYukleniciler||[]).some(a=>(a.odemeler||[]).length>0)
  );
  const rf = state.raporFilter||{yil:'',firma:'',durum:''};
  const yillar = [...new Set(state.projects.map(p=>p.yil))].sort((a,b)=>b-a);
  const firmalar = [...new Set([...FIRMALAR,...(state.dinamikListe.isSahipleri||[])])].sort();

  let filtered = state.projects.filter(p=>{
    if(rf.yil && +p.yil!==+rf.yil) return false;
    if(rf.firma && p.isinSahibi!==rf.firma) return false;
    return true;
  });

  const topAlindi = filtered.reduce((s,p)=>s+sumArr((p.musteriOdemeleri||[]).map(o=>+o.miktar)),0);
  const topOdendi = filtered.reduce((s,p)=>s+sumArr((p.altYukleniciler||[]).flatMap(a=>(a.odemeler||[]).map(o=>+o.miktar))),0);
  const topExtra = filtered.reduce((s,p)=>s+sumArr((p.extraGiderler||[]).map(g=>+g.miktar||0)),0);

  return `<div style="background:#fff;min-height:calc(100vh - 122px);padding:16px;">
    <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-family:'Nunito',sans-serif;">Filtrele</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
      <select onchange="setRaporFilter('yil',this.value)" style="width:100%;padding:10px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;font-family:'Nunito',sans-serif;background:#fff;color:#111;outline:none;">
        <option value="">Tüm Yıllar</option>
        ${yillar.map(y=>`<option value="${y}" ${rf.yil==y?'selected':''}>${y}</option>`).join('')}
      </select>
      <select onchange="setRaporFilter('firma',this.value)" style="width:100%;padding:10px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;font-family:'Nunito',sans-serif;background:#fff;color:#111;outline:none;">
        <option value="">Tüm Mimarlar / Firmalar</option>
        ${firmalar.map(f=>`<option value="${f}" ${rf.firma===f?'selected':''}>${f}</option>`).join('')}
      </select>
    </div>

    <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-family:'Nunito',sans-serif;">Özet</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;">
      <div style="background:#D1FAE5;border-radius:12px;padding:12px;">
        <div style="font-size:10px;color:#065F46;font-weight:700;text-transform:uppercase;margin-bottom:4px;font-family:'Nunito',sans-serif;">Alınan</div>
        <div style="font-size:18px;font-weight:800;color:#065F46;font-family:'Nunito',sans-serif;">${tl(topAlindi)}</div>
      </div>
      <div style="background:#FFF7ED;border-radius:12px;padding:12px;">
        <div style="font-size:10px;color:#9A3412;font-weight:700;text-transform:uppercase;margin-bottom:4px;font-family:'Nunito',sans-serif;">Ödenen</div>
        <div style="font-size:18px;font-weight:800;color:#9A3412;font-family:'Nunito',sans-serif;">${tl(topOdendi)}</div>
      </div>
      <div style="background:#111;border-radius:12px;padding:12px;">
        <div style="font-size:10px;color:#888;font-weight:700;text-transform:uppercase;margin-bottom:4px;font-family:'Nunito',sans-serif;">Kazanç</div>
        <div style="font-size:18px;font-weight:800;color:#fff;font-family:'Nunito',sans-serif;">${tl(topAlindi-topOdendi-topExtra)}</div>
      </div>
    </div>

    <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-family:'Nunito',sans-serif;">Ödemeler (${filtered.filter(p=>(p.musteriOdemeleri||[]).length>0).length} proje)</div>
    <div style="background:#F9F9F9;border-radius:14px;padding:4px 14px;margin-bottom:16px;">
      ${filtered.filter(p=>(p.musteriOdemeleri||[]).length>0).sort((a,b)=>(+b.yil-+a.yil)).map(p=>{
        const total=sumArr((p.musteriOdemeleri||[]).map(o=>+o.miktar));
        return `<div style="padding:10px 0;border-bottom:1px solid #F0F0F0;font-family:'Nunito',sans-serif;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div><div style="font-size:13px;font-weight:700;color:#111;">${p.isinAdi||'—'}</div>
            <div style="font-size:11px;color:#999;">${p.isinSahibi||''} · ${p.ay||''} ${p.yil||''}</div></div>
            <div style="font-size:14px;font-weight:800;color:#065F46;">${tl(total)}</div>
          </div>
          ${(p.musteriOdemeleri||[]).map(o=>`<div style="font-size:11px;color:#6B7280;margin-top:3px;">→ ${o.tarih}: ${tl(o.miktar)} (${o.sekil||''})</div>`).join('')}
        </div>`;
      }).join('')}
      ${filtered.filter(p=>(p.musteriOdemeleri||[]).length>0).length===0?'<div class="empty">Ödeme kaydı yok</div>':''}
    </div>

    <div style="display:flex;gap:10px;padding-bottom:20px;">
      <button onclick="raporCiktıSor('pdf')" style="flex:1;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;">📄 PDF</button>
      <button onclick="raporCiktıSor('excel')" style="flex:1;padding:14px;background:#fff;color:#111;border:2px solid #111;border-radius:12px;font-size:14px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;">📊 Excel</button>
    </div>
  </div>`;

// ACTIONS

window.formGeriHafiza = () => {
  // Keep form in state.savedForm so it can be restored
  state.savedForm = {...state.form, _draft:true};
  state.modal = null;
  goBackDirect();
};
window.formGeriTemizle = () => {
  state.form = emptyForm();
  state.savedForm = null;
  state.modal = null;
  goBackDirect();
};

window.goBack = () => {
  // If leaving a form that has data, ask what to do
  if(state.view === 'form' && state.form) {
    const f = state.form;
    const hasData = (f.isinAdi||'').trim() || f.isinSahibi || f.belediye || f.teklifFiyati || (f.altYukleniciler||[]).length > 0 || (f.not||'').trim();
    if(hasData) {
      state.modal = {type:'formGeriOnay'};
      render();
      return;
    }
  }
  goBackDirect();
};
window.goBackDirect = () => {
  if(state.navHistory.length > 0) {
    const prev = state.navHistory.pop();
    state.view = prev.view;
    state.selId = prev.selId || null;
    window.scrollTo && window.scrollTo(0,0);
    render();
  } else {
    state.view = 'dash';
    render();
  }
};
window.navTo=(v,id=null)=>{
  // Push current view to history before navigating
  if(state.view !== v) {
    state.navHistory.push({view:state.view, selId:state.selId});
    if(state.navHistory.length > 15) state.navHistory.shift();
  }
  if(v==='teklif'){state.view='teklifMenu';state.detailMode='teklif';window.scrollTo&&window.scrollTo(0,0);render();return;}
  if(v==='odeme'){state.view='list';state.filter={yil:'',durum:'onaylandi',q:''};state.detailMode='odeme';window.scrollTo&&window.scrollTo(0,0);render();return;}
  state.view=v;if(id)state.selId=id;
  if(v==='form'){ state.tarihSecimAcik=false;if(id){const p=state.projects.find(x=>x.id===id);state.form={...p,altYukleniciler:[...(p.altYukleniciler||[])],musteriOdemeleri:[...(p.musteriOdemeleri||[])]};}else {
        // Restore saved draft if exists
        if(state.savedForm && state.savedForm._draft) {
          const restored = {...state.savedForm};
          delete restored._draft;
          state.form = restored;
          // Don't clear savedForm yet so user can come back again
        } else {
          state.form = emptyForm();
          state.selId = null;
        }
      }}
  window.scrollTo&&window.scrollTo(0,0);render();
};

window.setFormAndRender = (k,v) => { if(state.form) { state.form[k]=v; render(); } };
window.yeniEkle = async (listeKey, inputId, formKey) => {
  const input = document.getElementById(inputId);
  const val = input?.value?.trim();
  if(!val) return;
  const yeniListe = [...(state.dinamikListe[listeKey]||[]), val];
  await saveDinamikListe(listeKey, yeniListe);
  if(state.form) state.form[formKey] = val;
  input.value = '';
  render();
};

window.raporExcel = async (listeDahil=false) => {
  const rf = state.raporFilter || {};

  let ps = state.projects.filter(p => {
    if(rf.yil && +p.yil !== +rf.yil) return false;
    if(rf.firma && p.isinSahibi !== rf.firma) return false;
    if(rf.durum && p.durum !== rf.durum) return false;
    return true;
  }).sort((a,b)=>(+b.yil-+a.yil)||MONTHS.indexOf(b.ay)-MONTHS.indexOf(a.ay));

  const onay = ps.filter(p=>p.durum==='onaylandi').length;
  const bekle = ps.filter(p=>p.durum==='teklif').length;
  const iptal = ps.filter(p=>p.durum==='iptal').length;
  const toplamFiyat = ps.reduce((s,p)=>s+(+p.teklifFiyati||0),0);

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Mekanik Takip';
  wb.created = new Date();

  // ── ÖZET SAYFASI ──────────────────────────────────────────
  const ws = wb.addWorksheet('Özet');
  ws.columns = [{width:28},{width:22},{width:16},{width:16}];

  // Başlık
  ws.mergeCells('A1:D1');
  const title = ws.getCell('A1');
  title.value = 'MEKANİK TAKİP — RAPOR';
  title.font = {bold:true, size:16, color:{argb:'FFFFFFFF'}, name:'Calibri'};
  title.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF000000'}};
  title.alignment = {horizontal:'center', vertical:'middle'};
  ws.getRow(1).height = 36;

  // Tarih satırı
  ws.mergeCells('A2:D2');
  const dateCell = ws.getCell('A2');

    (rf.yil||rf.firma||rf.durum ? '   |   Filtre: '+[rf.yil,rf.firma,labels[rf.durum]].filter(Boolean).join(' / ') : '');

  // Özet kartları başlık
  ws.mergeCells('A4:D4');

  secTitle.value = 'GENEL ÖZET';
  secTitle.font = {bold:true, size:11, color:{argb:'FFFFFFFF'}, name:'Calibri'};
  secTitle.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF333333'}};
  secTitle.alignment = {horizontal:'left', indent:1};
  ws.getRow(4).height = 24;

  // Özet verileri
  const summaryData = [
    ['Toplam Teklif', ps.length, 'Onaylandı', onay],
    ['Beklemede', bekle, 'İptal', iptal],
    ['Toplam Teklif Tutarı (₺)', toplamFiyat.toLocaleString('tr-TR'), '', ''],
  ];
  const summaryColors = [
    ['FF1A1A1A','FFFFFFFF','FF1A6B3A','FFFFFFFF'],
    ['FFB8860B','FFFFFFFF','FF8B0000','FFFFFFFF'],
    ['FF1A1A1A','FFFFFFFF','FFFFFFFF','FF000000'],
  ];

  summaryData.forEach((row, ri) => {
    const r = ws.addRow(row);
    r.height = 28;
    [0,1,2,3].forEach(ci => {
      const cell = r.getCell(ci+1);
      if(ri < 2) {
        cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb: ci<2?summaryColors[ri][0]:summaryColors[ri][2]}};
        cell.font = {bold: ci%2===1, size:ci%2===1?14:10, color:{argb:'FFFFFFFF'}, name:'Calibri'};
        cell.alignment = {horizontal: ci%2===0?'left':'right', vertical:'middle', indent:1};
      } else if(ci < 2) {
        cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF111111'}};
        cell.font = {bold: ci===1, size:ci===1?14:10, color:{argb:'FFFFFFFF'}, name:'Calibri'};
        cell.alignment = {horizontal: ci===0?'left':'right', vertical:'middle', indent:1};
      }
    });
  });

  ws.addRow([]);

  // ── TEKLİF LİSTESİ ──────────────────────────────────────────
  if(listeDahil && ps.length > 0) {
    ws.addRow([]);
    ws.mergeCells('A'+ws.lastRow.number+':D'+ws.lastRow.number);
    const listTitle = ws.lastRow.getCell(1);
    listTitle.value = 'TEKLİF LİSTESİ ('+ps.length+' Adet)';
    listTitle.font = {bold:true, size:11, color:{argb:'FFFFFFFF'}, name:'Calibri'};
    listTitle.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF333333'}};
    listTitle.alignment = {horizontal:'left', indent:1};
    ws.lastRow.height = 24;

    // Tablo başlıkları
    const headers = ['No','İş Adı','Mimar/Firma','Belediye','Yapı Sınıfı','Alan (m²)','Isıtma Türü','Tarih','Durum','Teklif (₺)'];
    const listWs = wb.addWorksheet('Teklif Listesi');
    listWs.columns = [
      {width:6},{width:36},{width:22},{width:16},{width:12},
      {width:10},{width:14},{width:14},{width:12},{width:16}
    ];

    const hRow = listWs.addRow(headers);
    hRow.height = 22;
    hRow.eachCell(cell => {
      cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF111111'}};
      cell.font = {bold:true, size:10, color:{argb:'FFFFFFFF'}, name:'Calibri'};
      cell.alignment = {horizontal:'center', vertical:'middle'};
      cell.border = {bottom:{style:'thin', color:{argb:'FF444444'}}};
    });

    ps.forEach((p, i) => {
      const row = listWs.addRow([
        i+1, p.isinAdi||'', p.isinSahibi||'', p.belediye||'', p.yapiSinifi||'',
        p.alan?+p.alan:'', p.isitma==='VAR'?p.isiitmaTuru:'Yok',
        (p.gun?p.gun+' ':'')+(p.ay||'')+' '+(p.yil||''),
        labels[p.durum]||'', p.teklifFiyati?+p.teklifFiyati:''
      ]);
      row.height = 18;
      const bg = i%2===0 ? 'FFFAFAFA' : 'FFFFFFFF';
      row.eachCell((cell,ci) => {
        cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:bg}};
        cell.font = {size:10, name:'Calibri'};
        cell.alignment = {vertical:'middle'};
      });
      // Durum rengi
      const durumCell = row.getCell(9);
      if(p.durum==='onaylandi') { durumCell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD1FAE5'}}; durumCell.font={bold:true,size:10,color:{argb:'FF065F46'},name:'Calibri'}; }
      else if(p.durum==='teklif') { durumCell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFEF3C7'}}; durumCell.font={bold:true,size:10,color:{argb:'FF92400E'},name:'Calibri'}; }
      else { durumCell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFEE2E2'}}; durumCell.font={bold:true,size:10,color:{argb:'FF991B1B'},name:'Calibri'}; }
      // Fiyat formatı
      row.getCell(10).numFmt = '#,##0';
      row.getCell(10).alignment = {horizontal:'right'};
    });
  }

  // İndir
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mekanik_rapor_'+new Date().toLocaleDateString('tr-TR').replace(/\./g,'-')+'.xlsx';
  a.click();
};

window.formatFiyatInput = function(input) {
  let val = input.value.replace(/[^0-9]/g, '');
  if(!val) { input.value = ''; return ''; }
  let num = parseInt(val, 10);
  let parts = [];
  let s = String(num);
  while(s.length > 3) { parts.unshift(s.slice(-3)); s = s.slice(0,-3); }
  if(s) parts.unshift(s);
  input.value = parts.join('.');
  return String(num);
};

}
window.doLogin=async()=>{const e=document.getElementById('le')?.value;const p=document.getElementById('lp')?.value;if(!e||!p){state.loginErr='E-posta ve şifre gerekli';render();return;}try{await auth.signInWithEmailAndPassword(e,p);}catch(err){state.loginErr=authErrTR(err);render();}};
window.doRegister=async()=>{const e=document.getElementById('le')?.value;const p=document.getElementById('lp')?.value;if(!e||!p){state.loginErr='E-posta ve şifre gerekli';render();return;}if(p.length<6){state.loginErr='Şifre en az 6 karakter olmalı';render();return;}try{await auth.createUserWithEmailAndPassword(e,p);}catch(err){state.loginErr=authErrTR(err);render();}};
window.doSignOut=async()=>{await auth.signOut();};
window.doForgotPassword=async()=>{
  const e=document.getElementById('le')?.value?.trim();
  if(!e){state.loginErr='Önce e-posta adresinizi yazın, sonra "Şifremi unuttum" a tıklayın.';render();return;}
  try{
    await auth.sendPasswordResetEmail(e);
    state.loginErr='Şifre sıfırlama bağlantısı '+e+' adresine gönderildi. E-postanızı (gerekirse spam/gereksiz klasörünü de) kontrol edin.';
  }catch(err){
    state.loginErr=authErrTR(err);
  }
  render();
};
window.openSifreDegistir=()=>{ state.modal={type:'sifreDegistir', err:''}; render(); };
window.doSifreDegistir=async()=>{
  const mevcut=document.getElementById('sd_mevcut')?.value||'';
  const yeni=document.getElementById('sd_yeni')?.value||'';
  const yeni2=document.getElementById('sd_yeni2')?.value||'';
  if(!mevcut||!yeni||!yeni2){ state.modal={...state.modal,err:'Lütfen tüm alanları doldurun.'}; render(); return; }
  if(yeni.length<6){ state.modal={...state.modal,err:'Yeni şifre en az 6 karakter olmalı.'}; render(); return; }
  if(yeni!==yeni2){ state.modal={...state.modal,err:'Yeni şifreler birbiriyle uyuşmuyor.'}; render(); return; }
  try{
    const user = auth.currentUser;
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, mevcut);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(yeni);
    state.modal=null; render();
    alert('Şifreniz başarıyla değiştirildi.');
  }catch(err){
    state.modal={...state.modal,err:authErrTR(err)};
    render();
  }
};
window.doImport=()=>{
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);d.forEach(p=>saveProject(p));alert(d.length+' proje yüklendi!');}catch{alert('Dosya okunamadı');}};
    r.readAsText(file);
  };inp.click();
};
window.doExport=()=>{const s=JSON.stringify(state.projects,null,2);const b=new Blob([s],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`mekanik_yedek_${todayStr()}.json`;a.click();};
window.doManualBackup=async()=>{
  const jsonStr=JSON.stringify(state.projects,null,2);
  const filename=`mekanik_yedek_${todayStr()}.json`;
  const wroteToFolder=await writeBackupToFolder(jsonStr, filename);
  if(wroteToFolder){ alert('Yedek, seçtiğiniz klasöre kaydedildi: '+filename); }
  else { window.doExport(); }
};

render();
</script>
